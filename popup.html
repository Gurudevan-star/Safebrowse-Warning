<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SafeBrowse</title><link rel="stylesheet" href="popup.css"></head>
  <body>
    <main>
      <div class="head"><span class="shield">✓</span><div><b>SafeBrowse</b><small>Suspicious-site warning is active</small></div></div>
      <section><span class="label">CURRENT WEBSITE</span><strong id="site">Checking…</strong><p id="status">This extension checks links before they open.</p></section>
      <div class="rule"></div>
      <p class="hint">If a site looks suspicious, you will be asked whether to go back or continue anyway. Your choice stays in your control.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
